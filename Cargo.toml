[workspace]
members = ["native", "harness"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
claviron = { version = "=0.2.1", default-features = false, features = ["orbit", "application"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
lto = "thin"
codegen-units = 1
